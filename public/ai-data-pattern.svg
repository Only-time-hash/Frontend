<svg width="320" height="320" viewBox="0 0 320 320"
xmlns="http://www.w3.org/2000/svg">

<style>
.icon{
stroke:#ffffff12;
stroke-width:2;
fill:none;
}
.node{
fill:#ffffff20;
}
</style>

<!-- LINE CHART -->
<polyline class="icon" points="10,240 40,210 70,220 100,180"/>

<!-- BAR CHART -->
<rect class="icon" x="120" y="220" width="10" height="30"/>
<rect class="icon" x="135" y="200" width="10" height="50"/>
<rect class="icon" x="150" y="185" width="10" height="65"/>

<!-- PIE CHART -->
<circle class="icon" cx="60" cy="60" r="20"/>
<path class="icon" d="M60 60 L60 40 A20 20 0 0 1 80 60 Z"/>

<!-- SCATTER PLOT -->
<circle class="node" cx="250" cy="40" r="3"/>
<circle class="node" cx="270" cy="60" r="3"/>
<circle class="node" cx="290" cy="35" r="3"/>
<circle class="node" cx="260" cy="75" r="3"/>

<!-- AXIS -->
<line class="icon" x1="20" y1="300" x2="120" y2="300"/>
<line class="icon" x1="20" y1="300" x2="20" y2="240"/>

<!-- TREND ARROW -->
<polyline class="icon" points="200,260 230,240 260,250"/>
<polyline class="icon" points="255,245 260,250 255,255"/>

<!-- NETWORK GRAPH -->
<circle class="node" cx="200" cy="100" r="4"/>
<circle class="node" cx="230" cy="130" r="4"/>
<circle class="node" cx="260" cy="110" r="4"/>
<circle class="node" cx="220" cy="160" r="4"/>

<line class="icon" x1="200" y1="100" x2="230" y2="130"/>
<line class="icon" x1="230" y1="130" x2="260" y2="110"/>
<line class="icon" x1="230" y1="130" x2="220" y2="160"/>

<!-- AI NODE CLUSTER -->
<circle class="node" cx="80" cy="150" r="4"/>
<circle class="node" cx="110" cy="170" r="4"/>
<circle class="node" cx="60" cy="180" r="4"/>
<circle class="node" cx="90" cy="200" r="4"/>

<line class="icon" x1="80" y1="150" x2="110" y2="170"/>
<line class="icon" x1="80" y1="150" x2="60" y2="180"/>
<line class="icon" x1="110" y1="170" x2="90" y2="200"/>
<line class="icon" x1="60" y1="180" x2="90" y2="200"/>

<!-- DATA PIPELINE -->
<rect class="icon" x="160" y="40" width="18" height="18"/>
<rect class="icon" x="200" y="40" width="18" height="18"/>
<rect class="icon" x="240" y="40" width="18" height="18"/>

<line class="icon" x1="178" y1="49" x2="200" y2="49"/>
<line class="icon" x1="218" y1="49" x2="240" y2="49"/>

<!-- CORRELATION MATRIX -->
<rect class="icon" x="20" y="20" width="60" height="60"/>

<line class="icon" x1="20" y1="40" x2="80" y2="40"/>
<line class="icon" x1="20" y1="60" x2="80" y2="60"/>

<line class="icon" x1="40" y1="20" x2="40" y2="80"/>
<line class="icon" x1="60" y1="20" x2="60" y2="80"/>

<!-- DATA FLOW -->
<polyline class="icon" points="150,150 170,170 190,150"/>
<polyline class="icon" points="185,145 190,150 185,155"/>

<!-- SMALL GRID -->
<rect class="icon" x="260" y="200" width="40" height="40"/>
<line class="icon" x1="260" y1="220" x2="300" y2="220"/>
<line class="icon" x1="260" y1="240" x2="300" y2="240"/>
<line class="icon" x1="280" y1="200" x2="280" y2="240"/>

</svg>